name: studyplan
description: StudyPlan — студенттерге арналған оқу тапсырмаларын жоспарлау қосымшасы.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3          # локалды NoSQL дерекқор (SQLite-қа балама), web/Windows/Android-та істейді
  hive_flutter: ^1.1.0  # Hive.initFlutter() — сақтау орнын автоматты анықтайды
  crypto: ^3.0.3        # құпиясөзді SHA-256 хэшімен сақтау үшін
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
